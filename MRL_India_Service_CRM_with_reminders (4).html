<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MRL India · Service Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Public+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --red:#E63946;
  --red-dark:#C1121F;
  --navy:#1D3557;
  --navy-2:#142640;
  --steel:#457B9D;
  --teal:#A8DADC;
  --paper:#F7F9FA;
  --card:#FFFFFF;
  --ink:#1B2733;
  --ink-soft:#5B6B7A;
  --line:#E3E8EC;
  --ok:#2A9D8F;
  --warn:#E9A23B;
  --danger:#E63946;
  --radius:10px;
  --shadow:0 1px 2px rgba(29,53,87,.06), 0 4px 14px rgba(29,53,87,.06);
  --disp:'Oswald',sans-serif;
  --body:'Public Sans',sans-serif;
  --mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--body);background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;}
::selection{background:var(--teal);}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;border:none;background:none;}
input,select,textarea{font-family:inherit;font-size:14px;}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:#c7d0d8;border-radius:6px;}
::-webkit-scrollbar-track{background:transparent;}

/* ---------- APP SHELL ---------- */
#app{display:flex;min-height:100vh;}

/* Sidebar */
.sidebar{
  width:230px;flex:none;background:linear-gradient(180deg,var(--navy) 0%, var(--navy-2) 100%);
  color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:40;
}
.brand{padding:22px 20px 16px;border-bottom:1px solid rgba(255,255,255,.08);}
.brand .mark{display:flex;align-items:center;gap:10px;}
.brand .swatch{width:34px;height:34px;border-radius:8px;background:var(--red);display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:700;font-size:17px;letter-spacing:.5px;box-shadow:0 3px 10px rgba(230,57,70,.4);}
.brand .name{font-family:var(--disp);font-weight:600;font-size:16.5px;letter-spacing:.3px;line-height:1.15;}
.brand .sub{font-size:10.5px;color:var(--teal);letter-spacing:1.5px;text-transform:uppercase;margin-top:2px;font-weight:600;}
.nav{flex:1;padding:14px 12px;overflow-y:auto;}
.nav-group-label{font-size:10px;text-transform:uppercase;letter-spacing:1.4px;color:rgba(255,255,255,.35);padding:14px 10px 6px;font-weight:700;}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:8px;color:rgba(255,255,255,.72);font-size:13.5px;font-weight:500;margin-bottom:2px;transition:background .15s,color .15s;}
.nav-item svg{width:17px;height:17px;flex:none;opacity:.85;}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff;}
.nav-item.active{background:var(--red);color:#fff;box-shadow:0 3px 10px rgba(230,57,70,.35);}
.nav-item .count{margin-left:auto;font-family:var(--mono);font-size:10.5px;background:rgba(255,255,255,.14);padding:1px 6px;border-radius:20px;}
.nav-item.active .count{background:rgba(255,255,255,.25);}
.sidebar-foot{padding:14px 20px;border-top:1px solid rgba(255,255,255,.08);font-size:11px;color:rgba(255,255,255,.4);}

/* Main */
.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{position:sticky;top:0;z-index:30;background:rgba(247,249,250,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:14px 28px;display:flex;align-items:center;gap:16px;}
.topbar h1{font-family:var(--disp);font-size:20px;font-weight:600;color:var(--navy);letter-spacing:.2px;}
.topbar .crumb{font-size:12px;color:var(--ink-soft);margin-top:1px;}
.topbar-actions{margin-left:auto;display:flex;gap:10px;align-items:center;}
.search-box{position:relative;}
.search-box input{width:230px;padding:8px 12px 8px 32px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:13px;}
.search-box input:focus{outline:none;border-color:var(--steel);}
.search-box svg{position:absolute;left:10px;top:9px;width:15px;height:15px;color:var(--ink-soft);}
.content{padding:24px 28px 60px;flex:1;}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:8px;font-size:13px;font-weight:600;transition:filter .15s, transform .1s;}
.btn:active{transform:translateY(1px);}
.btn svg{width:15px;height:15px;}
.btn-primary{background:var(--red);color:#fff;box-shadow:0 2px 8px rgba(230,57,70,.3);}
.btn-primary:hover{filter:brightness(1.06);}
.btn-navy{background:var(--navy);color:#fff;}
.btn-navy:hover{filter:brightness(1.15);}
.btn-ghost{background:#fff;color:var(--navy);border:1px solid var(--line);}
.btn-ghost:hover{background:#f1f4f6;}
.btn-sm{padding:6px 11px;font-size:12px;}
.btn-danger-outline{background:#fff;color:var(--red-dark);border:1px solid #f3c6ca;}
.btn-danger-outline:hover{background:#fff5f5;}

/* Stat cards */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:22px;}
.stat-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);position:relative;overflow:hidden;}
.stat-card .bar{position:absolute;left:0;top:0;bottom:0;width:4px;}
.stat-card .label{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--ink-soft);font-weight:700;}
.stat-card .value{font-family:var(--disp);font-size:30px;font-weight:600;color:var(--navy);margin-top:6px;}
.stat-card .delta{font-size:11.5px;color:var(--ink-soft);margin-top:4px;}

/* Panels */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:20px;}
.panel-head{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;}
.panel-head h2{font-family:var(--disp);font-size:15.5px;font-weight:600;color:var(--navy);}
.panel-head .hint{font-size:12px;color:var(--ink-soft);}
.panel-body{padding:18px 20px;}
.panel-head-actions{margin-left:auto;display:flex;gap:8px;}

.two-col{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;}
@media(max-width:1100px){.two-col{grid-template-columns:1fr;}}

/* Tables */
.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--ink-soft);padding:10px 12px;border-bottom:2px solid var(--line);font-weight:700;white-space:nowrap;}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap;}
tbody tr:hover{background:#fafcfd;}
.id-mono{font-family:var(--mono);font-size:12px;color:var(--navy);font-weight:600;}
.muted{color:var(--ink-soft);}
.empty-row td{text-align:center;padding:40px;color:var(--ink-soft);}

/* Badges / status stamps */
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.2px;white-space:nowrap;}
.badge::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;}
.badge.st-pending{background:#FDF0DE;color:#B5730B;}
.badge.st-assigned{background:#E7EEF5;color:var(--steel);}
.badge.st-progress{background:#FDE9DD;color:#C1560D;}
.badge.st-completed{background:#E1F3EF;color:var(--ok);}
.badge.st-cancelled{background:#FBE4E5;color:var(--red-dark);}
.badge.st-partpending{background:#F3E8FD;color:#7B2FBE;}
.badge.st-out{background:#E9EEF4;color:var(--navy);}
.badge.pr-high{background:#FBE4E5;color:var(--red-dark);}
.badge.pr-normal{background:#EEF1F3;color:var(--ink-soft);}
.badge.pr-low{background:#EAF6F1;color:var(--ok);}
.type-tag{display:inline-flex;padding:3px 9px;border-radius:6px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;}
.type-tag.install{background:var(--teal);color:var(--navy);}
.type-tag.service{background:#FBE4E5;color:var(--red-dark);}

/* Forms */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px;}
.form-grid.cols-3{grid-template-columns:1fr 1fr 1fr;}
.field{display:flex;flex-direction:column;gap:5px;}
.field.full{grid-column:1/-1;}
.field label{font-size:11.5px;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:.4px;}
.field label .req{color:var(--red);}
.field input,.field select,.field textarea{padding:9px 11px;border:1px solid var(--line);border-radius:7px;background:#fbfcfd;color:var(--ink);}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--steel);background:#fff;box-shadow:0 0 0 3px rgba(69,123,157,.12);}
.field textarea{resize:vertical;min-height:64px;}
.form-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;padding-top:16px;border-top:1px dashed var(--line);}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(20,38,64,.55);backdrop-filter:blur(2px);display:none;align-items:flex-start;justify-content:center;z-index:100;padding:40px 20px;overflow-y:auto;}
.modal-overlay.open{display:flex;}
.modal{background:#fff;border-radius:14px;width:100%;max-width:640px;box-shadow:0 20px 60px rgba(0,0,0,.25);animation:modalIn .18s ease;}
@keyframes modalIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.modal-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;}
.modal-head h3{font-family:var(--disp);font-size:17px;color:var(--navy);font-weight:600;}
.modal-head button{margin-left:auto;width:30px;height:30px;border-radius:8px;color:var(--ink-soft);font-size:18px;}
.modal-head button:hover{background:#f1f4f6;}
.modal-body{padding:20px 22px;max-height:70vh;overflow-y:auto;}

/* Tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;}
.tab-btn{padding:10px 16px;font-size:13px;font-weight:600;color:var(--ink-soft);border-bottom:2px solid transparent;}
.tab-btn.active{color:var(--red);border-color:var(--red);}

/* Toast */
#toast{position:fixed;bottom:24px;right:24px;z-index:200;display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--navy);color:#fff;padding:12px 18px;border-radius:9px;font-size:13px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.2);display:flex;align-items:center;gap:10px;animation:toastIn .2s ease;}
.toast.ok{background:var(--ok);}
.toast.err{background:var(--red-dark);}
@keyframes toastIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}

/* Ticket / job card - signature element */
.ticket{
  background:#fff;border:1px solid var(--line);border-radius:12px;position:relative;
  padding:22px 24px;font-family:var(--body);box-shadow:var(--shadow);
}
.ticket::before,.ticket::after{content:'';position:absolute;width:22px;height:22px;background:var(--paper);border-radius:50%;top:50%;transform:translateY(-50%);}
.ticket::before{left:-11px;}
.ticket::after{right:-11px;}
.ticket .tear{border-top:2px dashed var(--line);margin:16px 0;}
.ticket-head{display:flex;justify-content:space-between;align-items:flex-start;}
.ticket-id{font-family:var(--mono);font-size:19px;font-weight:700;color:var(--navy);letter-spacing:1px;}
.ticket-brand{font-family:var(--disp);font-size:11px;color:var(--red);font-weight:700;letter-spacing:1.5px;text-transform:uppercase;}
.stamp{
  font-family:var(--disp);font-weight:700;font-size:13px;letter-spacing:2px;text-transform:uppercase;
  border:2.5px solid currentColor;border-radius:6px;padding:5px 12px;transform:rotate(-6deg);display:inline-block;
  opacity:.9;
}
.stamp.pending{color:var(--warn);}
.stamp.progress{color:var(--red);}
.stamp.completed{color:var(--ok);}
.stamp.cancelled{color:var(--ink-soft);}
.ticket-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 20px;margin-top:14px;font-size:13px;}
.ticket-grid .k{font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-soft);font-weight:700;}
.ticket-grid .v{color:var(--ink);margin-top:1px;}

/* ---------- PENDING CALL ALERT ---------- */
.alert-banner{display:flex;align-items:flex-start;gap:12px;background:#FDF0DE;border:1px solid #F0D3A0;border-radius:10px;padding:14px 16px;margin-bottom:16px;}
.alert-banner.danger{background:#FBE4E5;border-color:#F3B7BB;}
.alert-banner .ic{width:34px;height:34px;flex:none;border-radius:9px;background:var(--warn);color:#fff;display:flex;align-items:center;justify-content:center;}
.alert-banner.danger .ic{background:var(--red-dark);}
.alert-banner .ic svg{width:18px;height:18px;}
.alert-banner .body{flex:1;}
.alert-banner .title{font-weight:700;font-size:13.5px;color:var(--navy);margin-bottom:2px;}
.alert-banner .desc{font-size:12.5px;color:var(--ink-soft);}
.alert-banner .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;}
.alert-chip{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:4px 10px 4px 4px;font-size:11.5px;cursor:pointer;transition:box-shadow .12s;}
.alert-chip:hover{box-shadow:0 2px 6px rgba(29,53,87,.12);}
.alert-chip .days{background:var(--red-dark);color:#fff;font-weight:700;border-radius:12px;padding:2px 7px;font-size:10.5px;}
.alert-chip.ok .days{background:var(--warn);}
.nav-item .count.alert-count{background:var(--red-dark);color:#fff;border-radius:20px;padding:1px 7px;animation:pulseDot 1.6s ease-in-out infinite;}
@keyframes pulseDot{0%,100%{opacity:1}50%{opacity:.45}}

/* ---------- PHOTO UPLOAD (CLOSE CALL) ---------- */
.photo-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:6px;}
.photo-slot{position:relative;aspect-ratio:1/1;border:1.5px dashed var(--line);border-radius:9px;background:#fbfcfd;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;overflow:hidden;text-align:center;padding:4px;}
.photo-slot:hover{border-color:var(--steel);}
.photo-slot.filled{border-style:solid;border-color:var(--ok);padding:0;}
.photo-slot img{width:100%;height:100%;object-fit:cover;}
.photo-slot .lbl{font-size:10px;color:var(--ink-soft);font-weight:700;text-transform:uppercase;letter-spacing:.3px;}
.photo-slot input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;}
.photo-slot .rm{position:absolute;top:4px;right:4px;width:20px;height:20px;background:rgba(20,38,64,.75);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;z-index:2;}
.ticket-photos{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px;}
.ticket-photos img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:7px;border:1px solid var(--line);cursor:pointer;}

/* Empty state */
.empty-state{padding:50px 20px;text-align:center;color:var(--ink-soft);}
.empty-state svg{width:44px;height:44px;color:var(--line);margin-bottom:10px;}
.empty-state .t{font-family:var(--disp);font-size:15px;color:var(--navy);font-weight:600;}
.empty-state .d{font-size:12.5px;margin-top:4px;}

/* Filters row */
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center;}
.filters select,.filters input{padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:#fff;font-size:12.5px;}
.filters .spacer{flex:1;}
.pill-toggle{display:flex;background:#eef1f3;border-radius:8px;padding:3px;gap:2px;}
.pill-toggle button{padding:6px 12px;border-radius:6px;font-size:12px;font-weight:600;color:var(--ink-soft);}
.pill-toggle button.active{background:#fff;color:var(--navy);box-shadow:var(--shadow);}

.avatar{width:26px;height:26px;border-radius:50%;background:var(--steel);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;flex:none;}
.tech-row{display:flex;align-items:center;gap:8px;}

.chart-wrap{position:relative;height:230px;}
.link-btn{color:var(--steel);font-weight:600;font-size:12.5px;}
.link-btn:hover{text-decoration:underline;}
.icon-btn{width:30px;height:30px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink-soft);}
.icon-btn:hover{background:#f1f4f6;color:var(--navy);}
.icon-btn svg{width:15px;height:15px;}

@media print{
  .sidebar,.topbar,.no-print{display:none!important;}
  .content{padding:0;}
  body{background:#fff;}
}

/* ---------- LOGIN GATE ---------- */
#loginGate{position:fixed;inset:0;background:linear-gradient(160deg,var(--navy) 0%, var(--navy-2) 100%);display:flex;align-items:center;justify-content:center;z-index:500;padding:20px;}
#loginGate.hidden{display:none;}
.login-card{background:#fff;border-radius:16px;padding:34px 32px;width:100%;max-width:380px;box-shadow:0 24px 60px rgba(0,0,0,.35);}
.login-card .swatch{width:42px;height:42px;border-radius:10px;background:var(--red);display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:700;font-size:20px;color:#fff;margin-bottom:14px;box-shadow:0 4px 12px rgba(230,57,70,.4);}
.login-card h2{font-family:var(--disp);font-size:19px;color:var(--navy);font-weight:600;}
.login-card .sub{font-size:12.5px;color:var(--ink-soft);margin-top:2px;margin-bottom:20px;}
.login-card .field{margin-bottom:14px;}
.login-card .err{font-size:12px;color:var(--red-dark);font-weight:600;margin-top:8px;min-height:14px;}
#loginGate .foot-note{font-size:11px;color:rgba(255,255,255,.55);text-align:center;margin-top:16px;}

/* ---------- SYNC STATUS / CENTER BADGE ---------- */
.sync-pill{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.3px;padding:5px 10px;border-radius:20px;background:rgba(255,255,255,.08);color:rgba(255,255,255,.75);}
.sync-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none;}
.sync-pill.offline .dot{background:var(--warn);animation:pulseDot 1.2s ease-in-out infinite;}
.center-badge{display:flex;align-items:center;gap:8px;background:#EEF1F3;border-radius:20px;padding:5px 8px 5px 12px;font-size:12.5px;font-weight:600;color:var(--navy);}
.center-badge button{color:var(--ink-soft);font-size:11px;font-weight:700;padding:4px 9px;border-radius:14px;background:#fff;}
.center-badge button:hover{color:var(--red-dark);}

</style>
</head>
<body>

<!-- LOGIN GATE -->
<div id="loginGate">
  <div class="login-card">
    <div class="swatch">M</div>
    <h2>MRL India Service Desk</h2>
    <div class="sub">Select your service center to continue</div>
    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="field"><label>Service Center</label>
        <select name="center" id="centerSelect"></select>
      </div>
      <div class="field"><label>Password</label>
        <input type="password" name="password" id="centerPassword" placeholder="Center password" autocomplete="off">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;">Enter</button>
      <div class="err" id="loginErr"></div>
    </form>
  </div>
</div>

<div id="app" style="display:none;">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="brand">
      <div class="mark">
        <div class="swatch">M</div>
        <div>
          <div class="name">MRL India</div>
          <div class="sub">Service Desk</div>
        </div>
      </div>
    </div>
    <nav class="nav" id="navList"></nav>
    <div class="sidebar-foot">v1.1 · Synced across 10 centers</div>
  </aside>

  <!-- MAIN -->
  <main class="main">
    <div class="topbar">
      <div>
        <h1 id="pageTitle">Dashboard</h1>
        <div class="crumb" id="pageCrumb">Overview of today's service operations</div>
      </div>
      <div class="topbar-actions">
        <div class="sync-pill" id="syncPill"><span class="dot"></span><span id="syncPillText">Synced</span></div>
        <div class="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <input id="globalSearch" placeholder="Search name, phone, ID..." oninput="onGlobalSearch(this.value)">
        </div>
        <button class="btn btn-primary" onclick="openQuickAdd()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>
          New
        </button>
        <div class="center-badge"><span id="centerBadgeName">—</span><button onclick="handleLogout()">Switch</button></div>
      </div>
    </div>
    <div class="content" id="content"></div>
  </main>

function updateSyncPill(state, label){

  if(!pill) return;
  pill.classList.toggle('offline', state!=='online');
  txt.textContent = label || (state==='online' ? 'Synced — all centers' : 'Local only');

function startCloudSync(){
  fsDoc.onSnapshot(snap=>{
    if(!snap.exists){
      const seeded = seedDB();
      fsDoc.set(seeded).catch(e=>console.warn('seed write failed', e));
      db = seeded; render(); updateSyncPill('online'); return;
    }
    db = Object.assign(defaultDB(), snap.data());
    let needsResave = ensureTechRosterSeeded();
    if(ensureCallReminders()) needsResave = true;
    if(needsResave){ fsDoc.set(db).catch(e=>console.warn('roster/reminder merge save failed', e)); }
    render();
    updateSyncPill(snap.metadata.fromCache ? 'offline' : 'online', snap.metadata.fromCache ? 'Reconnecting…' : 'Synced — all centers');
  }, err=>{
    console.warn('Firestore sync error, switching to local-only mode.', err);
    cloudReady = false; db = loadLocalDB(); render(); updateSyncPill('offline','Local only (sync error)');
  });
}

  }
}

/* compress a photo file client-side before it's stored/synced */
function compressImage(file, maxDim=800, quality=0.62){
  return new Promise((resolve,reject)=>{
    const img = new Image();
    const reader = new FileReader();
    reader.onload = ()=>{
      img.onload = ()=>{
        let w=img.width, h=img.height;
        if(w>h && w>maxDim){ h=Math.round(h*maxDim/w); w=maxDim; }
        else if(h>=w && h>maxDim){ w=Math.round(w*maxDim/h); h=maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* PIN code -> area lookup using India's public postal API (runs in the
   browser of whoever is using the form, not on this server) */
function lookupPincode(pin, form){
  if(!/^[0-9]{6}$/.test(pin) || !form || !form.area) return;
  const areaField = form.area;
  const oldPlaceholder = areaField.placeholder;
  areaField.placeholder = 'Looking up PIN…';
  fetch(`https://api.postalpincode.in/pincode/${pin}`)
    .then(res=>res.json())
    .then(data=>{
      if(data && data[0] && data[0].Status==='Success' && data[0].PostOffice && data[0].PostOffice.length){
        const po = data[0].PostOffice[0];
        areaField.value = `${po.Name}, ${po.District}`;
        toast(`Area filled from PIN ${pin}`, 'ok');
      } else {
        areaField.placeholder = oldPlaceholder;
        toast('PIN not found — enter area manually', 'err');
      }
    })
    .catch(()=>{ areaField.placeholder = oldPlaceholder; toast('Could not look up PIN — check connection', 'err'); });
}

    spares:['Spare Parts','Stock ledger \u2014 inward, outward, running balance'],
    jobcards:['Job Cards','Printable service tickets'],

    billing:['Monthly Billing','Service + travel charges by month'],
    archive:['Data Archive','Export and clear old records to stay within free-tier limits']};
  document.getElementById('pageTitle').textContent = titleMap[currentRoute][0];
  document.getElementById('pageCrumb').textContent = titleMap[currentRoute][1];
  const c = document.getElementById('content');
  if(currentRoute==='dashboard') c.innerHTML = renderDashboard();
  else if(currentRoute==='calls') c.innerHTML = renderCalls();
  else if(currentRoute==='inward') c.innerHTML = renderInward();
  else if(currentRoute==='spares') c.innerHTML = renderSpares();
  else if(currentRoute==='jobcards') c.innerHTML = renderJobCards();
  else if(currentRoute==='customers') c.innerHTML = renderCustomers();
  else if(currentRoute==='technicians') c.innerHTML = renderTechnicians();
  else if(currentRoute==='billing') c.innerHTML = renderBilling();
  else if(currentRoute==='archive') c.innerHTML = isAdminUser()? renderArchive() : emptyState('archive','Admin access required','Log in as HQ/Admin to use Data Archive.');
  if(currentRoute==='dashboard') drawCharts();
}

function statCard(label, value, color, delta){
  return `<div class="stat-card"><div class="bar" style="background:${color}"></div>
    <div class="label">${label}</div><div class="value">${value}</div><div class="delta">${delta}</div></div>`;

function statusBadge(status){
  const map = {'Pending':'st-pending','Assigned':'st-assigned','In Progress':'st-progress','Part Pending':'st-partpending','Completed':'st-completed','Cancelled':'st-cancelled','Delivered':'st-completed','Ready':'st-completed'};
  return `<span class="badge ${map[status]||'st-pending'}">${status}</span>`;
}
function priorityBadge(p){
  const map={'High':'pr-high','Normal':'pr-normal','Low':'pr-low'};
  return `<span class="badge ${map[p]||'pr-normal'}" style="background:none;">${p}</span>`;
}

let chartRefs = {};
function drawCharts(){
  if(typeof Chart === 'undefined') return;
  Object.values(chartRefs).forEach(ch=>ch && ch.destroy());
  const install = db.calls.filter(c=>c.type==='Installation').length;
  const service = db.calls.filter(c=>c.type==='Service').length;
  const ctx1 = document.getElementById('chartType');
  if(ctx1) chartRefs.type = new Chart(ctx1, {type:'doughnut', data:{labels:['Installation','Service'], datasets:[{data:[install,service], backgroundColor:['#A8DADC','#E63946'], borderWidth:0}]}, options:{plugins:{legend:{position:'bottom', labels:{boxWidth:10,font:{size:11}}}}, cutout:'65%'}});

  const statuses = ['Pending','Assigned','In Progress','Completed','Cancelled'];
  const counts = statuses.map(s=>db.calls.filter(c=>c.status===s).length);
  const ctx2 = document.getElementById('chartStatus');
  if(ctx2) chartRefs.status = new Chart(ctx2, {type:'bar', data:{labels:statuses, datasets:[{data:counts, backgroundColor:['#E9A23B','#457B9D','#E63946','#2A9D8F','#94A3AF'], borderRadius:6}]}, options:{plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true, ticks:{precision:0}}}}});

  const techData = techNames().map(t=>db.calls.filter(c=>c.technician===t && c.status!=='Completed' && c.status!=='Cancelled').length);
  const ctx3 = document.getElementById('chartTech');
  if(ctx3) chartRefs.tech = new Chart(ctx3, {type:'bar', data:{labels:techNames(), datasets:[{data:techData, backgroundColor:'#1D3557', borderRadius:6}]}, options:{indexAxis:'y', plugins:{legend:{display:false}}, scales:{x:{beginAtZero:true, ticks:{precision:0}}}}});
}

function toggleModelList(sel){
  const modelSelect = document.getElementById('modelSelect');

function fillFromCustomer(input){
  const list = input.list;
  if(!list) return;
  const opt = [...list.options].find(o=>o.value===input.value);
  if(!opt) return;
  const form = input.closest('form');
  form.phone.value = opt.dataset.phone||'';
  if(form.altPhone) form.altPhone.value = opt.dataset.altphone||'';
  if(form.address) form.address.value = opt.dataset.address||'';
  if(form.area && opt.dataset.area) form.area.value = opt.dataset.area;
  if(form.pincode && opt.dataset.pincode) form.pincode.value = opt.dataset.pincode;
  if(form.brand && opt.dataset.brand) form.brand.value = opt.dataset.brand;
}
function submitCall(e, type){
  e.preventDefault();
  const f = e.target;
  const cust = upsertCustomer({name:f.customerName.value.trim(), phone:f.phone.value.trim(), altPhone:f.altPhone.value.trim(), address:f.address.value.trim(), area:f.area.value.trim(), pincode:f.pincode.value.trim(), brand:f.brand.value});
  const call = {
    id: uid('CALL'), date: f.date.value||todayStr(), type,
    customerId: cust.id, customerName: cust.name, phone: cust.phone, altPhone: cust.altPhone, address: cust.address, area: cust.area, pincode: cust.pincode, brand: f.brand.value,
    product: f.product.value, model: f.model.value, serial: f.serial.value.trim(), purchaseDate: f.purchaseDate.value||'', issue: f.issue.value.trim(),
    technician: f.technician.value, priority: f.priority.value, status: f.technician.value && f.status.value==='Pending' ? 'Assigned' : f.status.value,
    notes:'', photoCount:0, closedAt:'', centerTag:currentCenter?currentCenter.name:'',
    distanceKm:0, charge:0, billed:false, billedAt:'',
    reminderDays: parseInt(f.reminderDays.value)||0,
    nextReminder: (f.status.value==='Completed' || f.reminderDays.value==='0') ? null : addDays(f.date.value||todayStr(), parseInt(f.reminderDays.value))
  };
  db.calls.push(call); saveDB(); closeModal(); render();
  toast(`${type} call ${call.id} registered`, 'ok');
  const waMsg = `Hi ${call.customerName}, your ${type} call has been registered with MRL India Service Desk.\nCall ID: ${call.id}\nTechnician: ${call.technician||'To be assigned shortly'}\nWe will contact you soon. Thank you!`;
  openWhatsAppPrompt('Send Registration Confirmation?', call.phone, waMsg);
}

}
function openPartPhotoLightbox(i){
  const src = (window.__currentPartPhotos||[])[i]; if(!src) return;
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(10,16,24,.9);z-index:1000;display:flex;align-items:center;justify-content:center;padding:24px;cursor:zoom-out;';
  overlay.onclick = ()=> overlay.remove();
  const img = document.createElement('img');

function handleStatusChange(id, status){
  if(status==='Completed'){ openCloseCallModal(id); return; }
  if(status==='Part Pending'){ openPartPendingModal(id); return; }
  updateCallStatus(id, status);
}
function stampFor(status){
  const map = {'Pending':'pending','Assigned':'pending','In Progress':'progress','Part Pending':'progress','Completed':'completed','Cancelled':'cancelled','Ready':'completed','Delivered':'completed'};
  return `<div class="stamp ${map[status]||'pending'}">${status}</div>`;
}
function updateCallStatus(id, status){
  const r=db.calls.find(c=>c.id===id); r.status=status;
  if(status==='Completed' || status==='Cancelled') r.nextReminder = null;
  if(status!=='Part Pending') r.partPendingSince = null;
  saveDB(); render(); viewCall(id); toast('Status updated','ok');
}
function snoozeReminder(id, days){
  const r=db.calls.find(c=>c.id===id); if(!r) return;
  r.nextReminder = addDays(todayStr(), days);
  saveDB(); render(); viewCall(id);
  toast(`Reminder snoozed to ${fmtDate(r.nextReminder)}`, 'ok');
}
function clearReminder(id){
  const r=db.calls.find(c=>c.id===id); if(!r) return;
  r.nextReminder = null;
  saveDB(); render(); viewCall(id);
  toast('Reminder cleared', 'ok');
}
function reminderBadge(r){
  if(r.status==='Completed' || r.status==='Cancelled') return '';
  if(r.status==='Part Pending'){
    const days = Math.max(0, reminderDaysBetween(r.partPendingSince||r.date));
    return `<span class="badge st-partpending">Part Pending · Day ${days+1}</span>`;
  }
  if(!r.nextReminder) return '<span class="badge" style="background:#EEF1F3;color:var(--ink-soft);">No reminder</span>';
  const diff = reminderDaysBetween(r.nextReminder);
  if(diff > 0) return `<span class="badge" style="background:#FDECEC;color:var(--red-dark);">Overdue ${diff}d</span>`;
  if(diff === 0) return `<span class="badge" style="background:#FDF0DE;color:#B5730B;">Due Today</span>`;
  return `<span class="badge" style="background:#E7EEF5;color:var(--steel);">${fmtDate(r.nextReminder)}</span>`;
}
function reminderCalls(){ return (db.calls||[]).filter(c=>c.status!=='Completed' && c.status!=='Cancelled' && c.status!=='Part Pending'); }
function overdueReminderCalls(){ const t=todayStr(); return reminderCalls().filter(c=>c.nextReminder && c.nextReminder < t); }
function dueTodayReminderCalls(){ const t=todayStr(); return reminderCalls().filter(c=>c.nextReminder === t); }
function partPendingCalls(){ return (db.calls||[]).filter(c=>c.status==='Part Pending'); }

/* ---------- periodic reminder watch: refresh + gentle toast nudge ---------- */
let _reminderWatchStarted = false;
let _lastReminderToastKey = '';
function startReminderWatch(){
  if(_reminderWatchStarted) return;
  _reminderWatchStarted = true;
  setInterval(checkReminderNudge, 60000);
  checkReminderNudge();
}
function checkReminderNudge(){
  if(!currentCenter) return;
  const overdue = overdueReminderCalls(), dueToday = dueTodayReminderCalls(), partPending = partPendingCalls();
  const key = todayStr()+':'+overdue.length+':'+dueToday.length+':'+partPending.length;
  if((overdue.length || dueToday.length || partPending.length) && key !== _lastReminderToastKey){
    _lastReminderToastKey = key;
    if(overdue.length) toast(`${overdue.length} call${overdue.length>1?'s':''} overdue for follow-up`, 'err');
    if(dueToday.length) toast(`${dueToday.length} call${dueToday.length>1?'s':''} due for follow-up today`, '');
    if(partPending.length) toast(`${partPending.length} call${partPending.length>1?'s':''} still awaiting spare part — daily reminder`, '');
  }
  if(currentRoute==='calls' || currentRoute==='dashboard') render();
}

/* ---------- PENDING CALL ALERT ---------- */
function daysSince(dateStr){
  if(!dateStr) return 0;
  const d1 = new Date(dateStr+'T00:00:00'), d2 = new Date(todayStr()+'T00:00:00');
  return Math.max(0, Math.round((d2-d1)/86400000));
}
function pendingAlertBanner(){
  const overdue = overdueReminderCalls(), dueToday = dueTodayReminderCalls(), partPending = partPendingCalls();
  const list = [...overdue, ...dueToday, ...partPending];
  if(!list.length) return '';
  const danger = overdue.length>0;
  const titleParts = [];
  if(overdue.length) titleParts.push(`${overdue.length} overdue`);
  if(dueToday.length) titleParts.push(`${dueToday.length} due today`);
  if(partPending.length) titleParts.push(`${partPending.length} awaiting spare part`);
  return `
  <div class="alert-banner ${danger?'danger':''}">
    <div class="ic">${iconSvg('phone')}</div>
    <div class="body">
      <div class="title">${titleParts.join(' · ')} — follow-up needed</div>
      <div class="desc">${danger?'Some reminder dates have passed. ':''}${partPending.length?'Part-pending calls remind daily until closed. ':''}Tap a call to update, snooze or close it.</div>
      <div class="chips">
        ${list.slice(0,8).map(c=>{
          if(c.status==='Part Pending'){ const d=Math.max(0,reminderDaysBetween(c.partPendingSince||c.date)); return `<div class="alert-chip" style="border-color:#E3CCF7;" onclick="viewCall('${c.id}')"><span class="days" style="background:#F3E8FD;color:#7B2FBE;">Day ${d+1}</span>${esc(c.customerName)} · ${c.id}</div>`; }
          const d=reminderDaysBetween(c.nextReminder); return `<div class="alert-chip ${d<=0?'ok':''}" onclick="viewCall('${c.id}')"><span class="days">${d===0?'Today':d+'d'}</span>${esc(c.customerName)} · ${c.id}</div>`;
        }).join('')}
        ${list.length>8?`<div class="alert-chip" onclick="navigate('calls')">+${list.length-8} more</div>`:''}
      </div>
    </div>
  </div>`;
}
function updateCallTech(id, tech){ const r=db.calls.find(c=>c.id===id); r.technician=tech; if(tech && r.status==='Pending') r.status='Assigned'; saveDB(); render(); viewCall(id); toast('Technician updated','ok'); }

/* =========================================================
   SPARE PARTS INVENTORY — master list + inward/outward ledger.
   Current stock is always derived live from the transaction
   ledger (never stored as a separate number), so it can never
   drift out of sync even with edits/deletes.
========================================================= */
const SPARE_CATEGORIES = ['Panel','Power Board','Main Board / PCB','Remote','IR Sensor','Speaker Driver','Cable / Wire','Wall Mount Kit','Screws & Fasteners','Other'];
const SPARE_UNITS = ['pcs','set','mtr','box'];
const KNOWN_VENDORS = ['SKM','Anjaneya','Raju','Vikas','MRL Kumarapark'];

function currentStock(spareId){
  return db.spareTx.filter(t=>t.spareId===spareId).reduce((sum,t)=> sum + (t.type==='Inward'? t.qty : -t.qty), 0);
}
function totalStockUnits(){ return db.spares.reduce((sum,s)=> sum + currentStock(s.id), 0); }
function lowStockSpares(){ return db.spares.filter(s=> currentStock(s.id) <= (s.reorderLevel||0)); }
function outwardThisMonth(){
  const ym = todayStr().slice(0,7);
  return db.spareTx.filter(t=>t.type==='Outward' && t.date && t.date.slice(0,7)===ym).reduce((sum,t)=>sum+t.qty,0);
}

let spareSearch = '';
function renderSpares(){
  const low = lowStockSpares();
  let rows = db.spares.filter(s=> !spareSearch || s.name.toLowerCase().includes(spareSearch) || (s.category||'').toLowerCase().includes(spareSearch))
    .sort((a,b)=>a.name.localeCompare(b.name));
  return `
  ${low.length? `
  <div class="alert-banner danger">
    <div class="ic">${iconSvg('box')}</div>
    <div class="body">
      <div class="title">${low.length} spare${low.length>1?'s':''} at or below reorder level</div>
      <div class="desc">Time to reorder from your vendor before you run out.</div>
      <div class="chips">
        ${low.slice(0,8).map(s=>`<div class="alert-chip" onclick="viewSpareHistory('${s.id}')"><span class="days">${currentStock(s.id)} left</span>${esc(s.name)}</div>`).join('')}
      </div>
    </div>
  </div>` : ''}
  <div class="stat-grid">
    ${statCard('Spare Part Types', db.spares.length, 'var(--steel)', 'In master list')}
    ${statCard('Total Units in Stock', totalStockUnits(), 'var(--navy)', 'Across all spares')}
    ${statCard('Low Stock Alerts', low.length, 'var(--red)', 'At or below reorder level')}
    ${statCard('Issued This Month', outwardThisMonth(), 'var(--warn)', 'Units used in repairs')}
  </div>
  <div class="panel">
    <div class="panel-head">
      <h2>Spare Parts Stock</h2>
      <div class="hint">${rows.length} of ${db.spares.length}</div>
      <div class="panel-head-actions">
        <button class="btn btn-ghost btn-sm" onclick="exportSparesCSV()">Export Stock CSV</button>
        <button class="btn btn-ghost btn-sm" onclick="exportSpareLedgerCSV()">Export Ledger CSV</button>
        <button class="btn btn-navy btn-sm" onclick="openSpareInwardForm()">+ Log Inward</button>
        <button class="btn btn-danger-outline btn-sm" onclick="openSpareOutwardForm()">+ Log Outward</button>
        <button class="btn btn-primary btn-sm" onclick="openAddSpareForm()">+ Add Spare</button>
      </div>
    </div>
    <div class="panel-body">
      <div class="filters">
        <input placeholder="Search spares..." oninput="spareSearch=this.value.toLowerCase();render()" style="flex:1;max-width:280px;">
        <div class="spacer"></div>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Name</th><th>Category</th><th>Unit</th><th>Current Stock</th><th>Reorder Level</th><th>Status</th><th></th></tr></thead>
          <tbody>
            ${rows.length? rows.map(s=>{
              const stock = currentStock(s.id);
              const low = stock <= (s.reorderLevel||0);
              return `<tr>
                <td>${esc(s.name)}</td>
                <td class="muted">${esc(s.category)||'—'}</td>
                <td class="muted">${esc(s.unit)}</td>
                <td style="font-weight:700;">${stock}</td>
                <td class="muted">${s.reorderLevel||0}</td>
                <td><span class="badge ${low?'st-cancelled':'st-completed'}">${low?'Low Stock':'OK'}</span></td>
                <td>
                  <button class="icon-btn" title="Inward" onclick="openSpareInwardForm('${s.id}')">${iconSvg('swap')}</button>
                  <button class="icon-btn" title="History" onclick="viewSpareHistory('${s.id}')">${iconSvg('ticket')}</button>
                </td>
              </tr>`;
            }).join('') : `<tr class="empty-row"><td colspan="7">No spare parts added yet. Click "+ Add Spare" to start.</td></tr>`}
          </tbody>
        </table>
      </div>
    </div>
  </div>`;
}
function spareDropdownOptions(selectedId){
  return db.spares.slice().sort((a,b)=>a.name.localeCompare(b.name))

function submitSpareOutward(e){
  e.preventDefault(); const f=e.target;
  const spare = db.spares.find(s=>s.id===f.spareId.value); if(!spare) return;
  const qty = parseInt(f.qty.value)||0;
  const stock = currentStock(spare.id);
  if(qty>stock){ if(!confirm(`Only ${stock} in stock, but issuing ${qty}. This will make stock negative. Continue?`)) return; }
  db.spareTx.push({id: uid('SPTX'), date:f.date.value||todayStr(), spareId:spare.id, spareName:spare.name, type:'Outward', qty, vendor:'', technician:f.technician.value, reference:f.reference.value.trim(), notes:f.notes.value.trim(), centerTag:currentCenter?currentCenter.name:''});
  saveDB(); closeModal(); render(); toast(`${qty} × ${spare.name} issued from stock`,'ok');
}
function viewSpareHistory(spareId){
  const spare = db.spares.find(s=>s.id===spareId); if(!spare) return;
  const tx = db.spareTx.filter(t=>t.spareId===spareId).sort((a,b)=>(a.date+a.id).localeCompare(b.date+b.id));
  let running = 0;
  const withBalance = tx.map(t=>{ running += (t.type==='Inward'?t.qty:-t.qty); return {...t, balance:running}; }).reverse();
  openModal(`${esc(spare.name)} — Stock History`, `
    <div class="ticket-grid" style="margin-bottom:14px;">
      <div><div class="k">Current Stock</div><div class="v" style="font-weight:700;">${currentStock(spareId)} ${esc(spare.unit)}</div></div>
      <div><div class="k">Category</div><div class="v">${esc(spare.category)||'—'}</div></div>
      <div><div class="k">Reorder Level</div><div class="v">${spare.reorderLevel||0}</div></div>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Date</th><th>Type</th><th>Qty</th><th>Balance</th><th>Vendor/Tech</th><th>Reference</th></tr></thead>
        <tbody>
          ${withBalance.length? withBalance.map(t=>`
            <tr>
              <td>${fmtDate(t.date)}</td>
              <td><span class="badge ${t.type==='Inward'?'st-completed':'st-progress'}">${t.type}</span></td>
              <td>${t.type==='Inward'?'+':'-'}${t.qty}</td>
              <td style="font-weight:700;">${t.balance}</td>
              <td class="muted">${esc(t.vendor||t.technician)||'—'}</td>
              <td class="muted">${esc(t.reference)||'—'}</td>
            </tr>`).join('') : `<tr class="empty-row"><td colspan="6">No transactions yet.</td></tr>`}
        </tbody>
      </table>
    </div>
    <div class="form-actions">
      <button class="btn btn-danger-outline" onclick="deleteSpare('${spareId}')">Delete Spare</button>
      <button class="btn btn-navy" onclick="openSpareOutwardForm('${spareId}')">Log Outward</button>
      <button class="btn btn-primary" onclick="openSpareInwardForm('${spareId}')">Log Inward</button>
      <button class="btn btn-ghost" onclick="closeModal()">Close</button>
    </div>
  `, true);
}
function deleteSpare(spareId){
  if(!confirm('Delete this spare part and its entire transaction history? This cannot be undone.')) return;
  db.spares = db.spares.filter(s=>s.id!==spareId);
  db.spareTx = db.spareTx.filter(t=>t.spareId!==spareId);
  saveDB(); closeModal(); render(); toast('Spare part deleted');
}
function exportSparesCSV(){
  const headers = ['ID','Name','Category','Unit','Current Stock','Reorder Level','Status'];
  const rows = db.spares.map(s=>{
    const stock = currentStock(s.id);
    return [s.id,s.name,s.category,s.unit,stock,s.reorderLevel||0, stock<=(s.reorderLevel||0)?'Low Stock':'OK'];
  });
  const csv = [headers.join(','), ...rows.map(r=>r.map(v=>`"${(v??'').toString().replace(/"/g,'""')}"`).join(','))].join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `MRL_Spares_Stock_${todayStr()}.csv`; a.click();
  toast('Stock CSV exported','ok');
}
function exportSpareLedgerCSV(){
  const headers = ['ID','Date','Spare','Type','Qty','Vendor','Technician','Reference','Notes','LoggedBy'];
  const rows = db.spareTx.slice().sort((a,b)=>(a.date+a.id).localeCompare(b.date+b.id))
    .map(t=>[t.id,t.date,t.spareName,t.type,t.qty,t.vendor||'',t.technician||'',t.reference||'',t.notes||'',t.centerTag||'']);
  const csv = [headers.join(','), ...rows.map(r=>r.map(v=>`"${(v??'').toString().replace(/"/g,'""')}"`).join(','))].join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `MRL_Spares_Ledger_${todayStr()}.csv`; a.click();
  toast('Ledger CSV exported','ok');
}

      <div class="hint">${rows.length} of ${db.customers.length}</div>

    <div class="panel-body">

          <thead><tr><th>ID</th><th>Name</th><th>Phone</th><th>Alt Phone</th><th>Area</th><th>Brand</th><th>Calls</th><th>Inward</th><th></th></tr></thead>

function openCustomerForm(){

    <form onsubmit="submitCustomer(event)">

        <div class="field"><label>Name <span class="req">*</span></label><input name="name" required></div>
        <div class="field"><label>Phone <span class="req">*</span></label><input name="phone" required pattern="[0-9]{10}" maxlength="10"></div>
        <div class="field"><label>Alternative Number</label><input name="altPhone" pattern="[0-9]{10}" maxlength="10" placeholder="Optional 2nd number"></div>

        <div class="field"><label>PIN Code</label><input name="pincode" maxlength="6" pattern="[0-9]{6}" placeholder="6-digit PIN" oninput="if(this.value.length===6) lookupPincode(this.value, this.form)"></div>

function submitCustomer(e){
  e.preventDefault(); const f=e.target;

  saveDB(); closeModal(); render(); toast('Customer saved','ok');
}

  const inward = db.inward.filter(x=>x.customerId===id);
  openModal(esc(c.name), `
    <div class="ticket-grid" style="margin-bottom:14px;">
      <div><div class="k">Phone</div><div class="v">${esc(c.phone)}</div></div>
      <div><div class="k">Alt. Number</div><div class="v">${esc(c.altPhone)||'—'}</div></div>
      <div><div class="k">Area</div><div class="v">${esc(c.area)||'—'} ${c.pincode?('· '+esc(c.pincode)):''}</div></div>
      <div><div class="k">Address</div><div class="v">${esc(c.address)||'—'}</div></div>
      <div><div class="k">Brand</div><div class="v">${esc(c.brand)||'—'}</div></div>
    </div>
    <h3 style="font-family:var(--disp);font-size:13px;color:var(--navy);margin-bottom:8px;">Call History (${calls.length})</h3>
    <div class="table-wrap" style="margin-bottom:16px;"><table><thead><tr><th>ID</th><th>Type</th><th>Date</th><th>Status</th></tr></thead>

    <h3 style="font-family:var(--disp);font-size:13px;color:var(--navy);margin-bottom:8px;">Inward History (${inward.length})</h3>
    <div class="table-wrap"><table><thead><tr><th>ID</th><th>Model</th><th>Date In</th><th>Status</th></tr></thead>
    <tbody>${inward.length? inward.map(r=>`<tr><td class="id-mono">${r.id}</td><td>${esc(r.model)}</td><td>${fmtDate(r.dateIn)}</td><td>${statusBadge(r.status)}</td></tr>`).join(''):'<tr class="empty-row"><td colspan="4">None</td></tr>'}</tbody></table></div>
    <div class="form-actions"><button class="btn btn-ghost" onclick="closeModal()">Close</button></div>

function openAddTechnicianForm(){

    <form onsubmit="submitAddTechnician(event)">

/* =========================================================
   MONTHLY BILLING
========================================================= */
let billingMonth = todayStr().slice(0,7); // YYYY-MM
function renderBilling(){
  const rows = db.calls.filter(c=> c.status==='Completed' && c.date && c.date.slice(0,7)===billingMonth)
    .sort((a,b)=>(a.date+a.id).localeCompare(b.date+b.id));
  const rate = db.settings.kmRate||10;
  let totalService=0, totalTravel=0, totalKm=0;
  rows.forEach(r=>{ totalService += (r.charge||0); totalTravel += (r.travelCharge!==undefined? r.travelCharge : (r.distanceKm||0)*rate); totalKm += (r.distanceKm||0); });
  const grandTotal = totalService + totalTravel;
  const billedCount = rows.filter(r=>r.billed).length;

  return `
  <div class="panel">
    <div class="panel-head">
      <h2>Monthly Billing</h2>
      <div class="hint">${rows.length} completed calls</div>
      <div class="panel-head-actions">
        <input type="month" value="${billingMonth}" onchange="billingMonth=this.value;render()" style="padding:8px 10px;border:1px solid var(--line);border-radius:7px;">
        <button class="btn btn-ghost btn-sm" onclick="exportBillingCSV()">Export CSV</button>
        <button class="btn btn-navy btn-sm" onclick="markAllBilled()">Mark All Billed</button>
      </div>
    </div>
    <div class="panel-body">
      <div class="filters" style="align-items:flex-end;">
        <div class="field" style="margin:0;"><label>Rate per KM (₹)</label><input type="number" min="0" step="0.5" value="${rate}" style="width:110px;" onchange="updateKmRate(this.value)"></div>
        <div class="spacer"></div>
      </div>
      <div class="stat-grid" style="margin-bottom:18px;">
        ${statCard('Total KM', totalKm.toFixed(1), 'var(--steel)', 'This month, all centers')}
        ${statCard('Service Charges', '₹'+totalService.toFixed(0), 'var(--navy)', 'Sum of job charges')}
        ${statCard('Travel Charges', '₹'+totalTravel.toFixed(0), 'var(--warn)', `At ₹${rate}/km`)}
        ${statCard('Grand Total', '₹'+grandTotal.toFixed(0), 'var(--ok)', `${billedCount}/${rows.length} billed`)}
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Call ID</th><th>Date</th><th>Customer</th><th>Technician</th><th>KM</th><th>Travel ₹</th><th>Service ₹</th><th>Total ₹</th><th>Billed</th></tr></thead>
          <tbody>
            ${rows.length? rows.map(r=>{
              const travel = r.travelCharge!==undefined? r.travelCharge : (r.distanceKm||0)*rate;
              const total = (r.charge||0) + travel;
              return `<tr>
                <td class="id-mono">${r.id}</td>
                <td>${fmtDate(r.date)}</td>
                <td>${esc(r.customerName)}</td>
                <td>${esc(r.technician)||'—'}</td>
                <td>${r.distanceKm||0}</td>
                <td>₹${travel.toFixed(0)}</td>
                <td>₹${(r.charge||0).toFixed(0)}</td>
                <td style="font-weight:700;">₹${total.toFixed(0)}</td>
                <td><button class="badge ${r.billed?'st-completed':'st-pending'}" style="border:none;cursor:pointer;" onclick="toggleBilled('${r.id}')">${r.billed?'Billed':'Pending'}</button></td>
              </tr>`;
            }).join('') : `<tr class="empty-row"><td colspan="9">No completed calls in this month yet.</td></tr>`}
          </tbody>
        </table>
      </div>
    </div>
  </div>`;
}
function updateKmRate(v){
  db.settings.kmRate = parseFloat(v)||10;
  db.calls.forEach(r=>{ if(r.status==='Completed') r.travelCharge = (r.distanceKm||0)*db.settings.kmRate; });
  saveDB(); render(); toast('KM rate updated','ok');
}
function toggleBilled(id){
  const r = db.calls.find(c=>c.id===id); if(!r) return;
  r.billed = !r.billed; r.billedAt = r.billed? todayStr() : '';
  saveDB(); render();
}
function markAllBilled(){
  const rows = db.calls.filter(c=> c.status==='Completed' && c.date && c.date.slice(0,7)===billingMonth && !c.billed);
  if(!rows.length){ toast('Nothing pending to bill','err'); return; }
  if(!confirm(`Mark ${rows.length} call(s) as billed for ${billingMonth}?`)) return;
  rows.forEach(r=>{ r.billed=true; r.billedAt=todayStr(); });
  saveDB(); render(); toast(`${rows.length} call(s) marked billed`,'ok');
}
function exportBillingCSV(){
  const rate = db.settings.kmRate||10;
  const rows = db.calls.filter(c=> c.status==='Completed' && c.date && c.date.slice(0,7)===billingMonth);
  const headers = ['Call ID','Date','Customer','Phone','Technician','Area','KM','Travel Charge','Service Charge','Total','Billed','Logged By'];
  const data = rows.map(r=>{
    const travel = r.travelCharge!==undefined? r.travelCharge : (r.distanceKm||0)*rate;
    return [r.id,r.date,r.customerName,r.phone,r.technician,r.area,r.distanceKm||0,travel.toFixed(0),(r.charge||0).toFixed(0),(travel+(r.charge||0)).toFixed(0),r.billed?'Yes':'No',r.centerTag||''];
  });
  const csv = [headers.join(','), ...data.map(r=>r.map(v=>`"${(v??'').toString().replace(/"/g,'""')}"`).join(','))].join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `MRL_Billing_${billingMonth}.csv`; a.click();
  toast('Billing CSV exported','ok');
}

function emptyState(icon, title, desc){
  return `<div class="empty-state">${iconSvg(icon)}<div class="t">${title}</div><div class="d">${desc}</div></div>`;
}

/* =========================================================
   DATA ARCHIVE — export + clear old records so the free
   Firebase tier (storage + reads) stays comfortable forever.
   Admin/HQ login only. Nothing is deleted without an export first.
========================================================= */
let archiveCutoff = (function(){ const d=new Date(); d.setFullYear(d.getFullYear()-1); return d.toISOString().slice(0,10); })();
let archiveExportDone = false;
function archivableCalls(){ return db.calls.filter(c=> (c.status==='Completed'||c.status==='Cancelled') && c.date && c.date < archiveCutoff); }
function archivableInward(){ return db.inward.filter(i=> i.status==='Delivered' && i.dateOut && i.dateOut < archiveCutoff); }
function archivableJobcards(){ return db.jobcards.filter(j=> (j.status==='Completed'||j.status==='Cancelled') && j.date && j.date < archiveCutoff); }

function renderArchive(){
  const calls = archivableCalls(), inward = archivableInward(), jobcards = archivableJobcards();
  const photosToFree = calls.filter(c=>c.photoCount>0).length;
  return `
  <div class="alert-banner">
    <div class="ic">${iconSvg('archive')}</div>
    <div class="body">
      <div class="title">Keep the free Firebase tier free — forever</div>
      <div class="desc">Export old, finished records to a CSV backup, then clear them from the live database. This keeps storage and daily reads well within the no-cost limits no matter how many years you run this CRM. Nothing is ever deleted without exporting first.</div>
    </div>
  </div>
  <div class="panel">
    <div class="panel-head">
      <h2>Archive Records Older Than</h2>
      <div class="panel-head-actions">
        <input type="date" value="${archiveCutoff}" onchange="archiveCutoff=this.value; archiveExportDone=false; render();" style="padding:8px 10px;border:1px solid var(--line);border-radius:7px;">
      </div>
    </div>
    <div class="panel-body">
      <div class="stat-grid" style="margin-bottom:18px;">
        ${statCard('Calls to Archive', calls.length, 'var(--steel)', 'Completed/Cancelled, before cutoff')}
        ${statCard('Inward to Archive', inward.length, 'var(--navy)', 'Delivered, before cutoff')}
        ${statCard('Job Cards to Archive', jobcards.length, 'var(--warn)', 'Completed/Cancelled, before cutoff')}
        ${statCard('Photo Sets to Free Up', photosToFree, 'var(--ok)', 'Storage reclaimed on delete')}
      </div>
      <div class="form-actions" style="border-top:none;padding-top:0;justify-content:flex-start;">
        <button class="btn btn-navy" onclick="exportArchive()">1. Export Archive CSV</button>
        <button class="btn btn-danger-outline" onclick="deleteArchivedRecords()" ${(!calls.length&&!inward.length&&!jobcards.length)?'disabled':''}>2. Delete Archived Records${archiveExportDone?'':' (export first)'}</button>
      </div>
    </div>
  </div>`;
}
function exportArchive(){
  const calls = archivableCalls(), inward = archivableInward(), jobcards = archivableJobcards();
  if(!calls.length && !inward.length && !jobcards.length){ toast('Nothing to archive before this date','err'); return; }
  const dl = (filename, headers, rows)=>{
    const csv = [headers.join(','), ...rows.map(r=>r.map(v=>`"${(v??'').toString().replace(/"/g,'""')}"`).join(','))].join('\n');
    const blob = new Blob([csv], {type:'text/csv'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; a.click();
  };
  if(calls.length) dl(`MRL_Archive_Calls_before_${archiveCutoff}.csv`,
    ['ID','Date','Type','Customer','Phone','AltPhone','Product','Model','Serial','PurchaseDate','Technician','Status','ClosedOn','Area','Pincode','KM','ServiceCharge','TravelCharge','Billed','LoggedBy'],
    calls.map(r=>[r.id,r.date,r.type,r.customerName,r.phone,r.altPhone||'',r.product,r.model,r.serial||'',r.purchaseDate||'',r.technician,r.status,r.closedAt||'',r.area||'',r.pincode||'',r.distanceKm||0,r.charge||0,r.travelCharge||0,r.billed?'Yes':'No',r.centerTag||'']));
  setTimeout(()=>{
    if(inward.length) dl(`MRL_Archive_Inward_before_${archiveCutoff}.csv`,
      ['ID','DateIn','Customer','Phone','Model','Serial','Technician','DateOut','DeliveredBy'],
      inward.map(r=>[r.id,r.dateIn,r.customerName,r.phone,r.model,r.serial,r.technician,r.dateOut,r.deliveredBy||'']));
  }, 400);
  setTimeout(()=>{
    if(jobcards.length) dl(`MRL_Archive_JobCards_before_${archiveCutoff}.csv`,
      ['ID','Date','Customer','Product','Model','Technician','Status','Charge'],
      jobcards.map(r=>[r.id,r.date,r.customerName,r.product,r.model,r.technician,r.status,r.charge||'']));
  }, 800);
  archiveExportDone = true;
  toast(`Exported ${calls.length} calls, ${inward.length} inward, ${jobcards.length} job cards`, 'ok');
}
function deleteArchivedRecords(){
  if(!archiveExportDone){ toast('Please export the CSV backup first', 'err'); return; }
  const calls = archivableCalls(), inward = archivableInward(), jobcards = archivableJobcards();
  const total = calls.length + inward.length + jobcards.length;
  if(!total){ toast('Nothing to delete','err'); return; }
  if(!confirm(`Permanently remove ${calls.length} calls, ${inward.length} inward records, and ${jobcards.length} job cards dated before ${archiveCutoff} from the live database? You already have the CSV backup.`)) return;
  const callIds = new Set(calls.map(c=>c.id));
  db.calls = db.calls.filter(c=>!callIds.has(c.id));
  const inwardIds = new Set(inward.map(i=>i.id));
  db.inward = db.inward.filter(i=>!inwardIds.has(i.id));
  const jcIds = new Set(jobcards.map(j=>j.id));
  db.jobcards = db.jobcards.filter(j=>!jcIds.has(j.id));
  if(cloudReady){
    calls.filter(c=>c.photoCount>0).forEach(c=>{
      firebase.firestore().collection('mrl_photos').doc(c.id).delete().catch(()=>{});
    });
  }
  saveDB(); archiveExportDone = false; render();
  toast(`Archived and removed ${total} record(s)`, 'ok');
}

/* ---------- CSV EXPORT ---------- */
function exportCSV(kind){
  let rows = [], headers = [];
  if(kind==='calls'){ headers=['ID','Date','Type','Customer','Phone','Alt Phone','Product','Model','Serial No.','Purchase Date','Technician','Priority','Status','Next Reminder','Part Note','Part Pending Since','Closed On','Photos','Area','Pincode','KM','Service Charge','Travel Charge','Billed','Logged By']; rows = db.calls.map(r=>[r.id,r.date,r.type,r.customerName,r.phone,r.altPhone||'',r.product,r.model,r.serial||'',r.purchaseDate||'',r.technician,r.priority,r.status,r.nextReminder||'',r.partNote||'',r.partPendingSince||'',r.closedAt||'',r.photoCount||0,r.area||'',r.pincode||'',r.distanceKm||0,r.charge||0,r.travelCharge||0,r.billed?'Yes':'No',r.centerTag||'']); }
  if(kind==='inward'){ headers=['ID','Date In','Customer','Phone','Alt Phone','Area','Pincode','Model','Serial','Purchase Date','Technician','Status','Date Out']; rows = db.inward.map(r=>[r.id,r.dateIn,r.customerName,r.phone,r.altPhone||'',r.area||'',r.pincode||'',r.model,r.serial,r.purchaseDate||'',r.technician,r.status,r.dateOut]); }
  if(kind==='customers'){ headers=['ID','Name','Phone','Alt Phone','Address','Area','Pincode','Brand']; rows = db.customers.map(r=>[r.id,r.name,r.phone,r.altPhone||'',r.address,r.area,r.pincode||'',r.brand]); }
  const csv = [headers.join(','), ...rows.map(r=>r.map(v=>`"${(v??'').toString().replace(/"/g,'""')}"`).join(','))].join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `MRL_${kind}_${todayStr()}.csv`; a.click();
  toast('CSV exported','ok');
}
